[project]
name = "rooftop-energy-estimator-backend"
version = "0.1.0"
description = "Backend (Django modular monolith) + ML runtime for the Rooftop Energy Estimator."
requires-python = ">=3.12,<3.13"

# Runtime dependencies. Backend + ML runtime share a single image so tests can import ml/.
dependencies = [
    # --- Django core / web ---
    "Django>=5.0,<5.1",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt>=5.3,<5.4",
    "django-filter>=24.2,<25.0",
    "drf-spectacular>=0.27,<0.28",
    "django-cors-headers>=4.4,<4.5",
    "django-environ>=0.11,<0.12",
    "python-dotenv>=1.0,<2.0",
    # --- Database ---
    "psycopg[binary]>=3.2,<3.3",
    # --- Async task processing ---
    "celery[redis]>=5.4,<5.5",
    "redis>=5.0,<6.0",
    # --- Object storage (S3/MinIO adapter, optional import guarded in code) ---
    "boto3>=1.34,<2.0",
    # --- ML runtime (installed in the same image; backend tests import ml/) ---
    "numpy>=1.26,<2.0",
    "rasterio>=1.4,<1.6",
    "geopandas>=0.14,<1.1",
    "shapely>=2.0,<3.0",
    "scikit-image>=0.23,<0.25",
    "pvlib>=0.11,<0.12",
    # tensorflow-cpu ships x86_64 wheels; on aarch64 (Apple Silicon / arm64 CI)
    # only the plain `tensorflow` wheel exists and is CPU-only without a GPU.
    "tensorflow-cpu>=2.16,<2.18; platform_machine == 'x86_64'",
    "tensorflow>=2.16,<2.18; platform_machine == 'aarch64'",
    # --- PDF report generation (pure-Python; no system libraries, offline) ---
    "reportlab>=4.2,<5.0",
]

[project.optional-dependencies]
dev = [
    # --- Linting / formatting / typing ---
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<1.12",
    "django-stubs[compatible-mypy]>=5.0,<5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15,<3.16",
    # --- Testing ---
    "pytest>=8.3,<9.0",
    "pytest-django>=4.8,<5.0",
    "pytest-cov>=5.0,<6.0",
    "factory-boy>=3.3,<4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The distributable Python packages that live under backend/.
packages = ["config", "common"]

# ---------------------------------------------------------------------------
# Ruff — lint + format for backend/ and ml/
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "ml"]
# Django-generated migration files are machine-written; do not lint/format them.
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "N999",   # project package name (config) is intentional
    "RUF012", # Django/DRF class attrs (Meta.ordering, permission_classes) are mutable by convention
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"conftest.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["config", "common", "apps", "ml"]

# ---------------------------------------------------------------------------
# mypy — strict typing for backend
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_reexport = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
# Third-party libs without complete type stubs.
module = [
    "environ.*",
    "celery.*",
    "boto3.*",
    "botocore.*",
    "rasterio.*",
    "geopandas.*",
    "shapely.*",
    "skimage.*",
    "pvlib.*",
    "tensorflow.*",
    "factory.*",
    "django_filters.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py", "*_test.py"]
testpaths = ["common", "apps", "tests"]
addopts = "--reuse-db --strict-markers --ds=config.settings.test"
filterwarnings = ["ignore::DeprecationWarning"]
